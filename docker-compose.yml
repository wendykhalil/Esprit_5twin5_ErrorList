# Local SolarShare stack. No real secret belongs in this file.
# MySQL root has an empty password on purpose for this local stack only.
# The app container forces that empty password and does not reuse a host DB_PASSWORD.
# Stop publishing port 3306 before any shared use.

x-php: &php
  image: solarshare:local
  init: true
  env_file:
    - path: .env
      required: false
  environment: &php-env
    APP_NAME: ${APP_NAME:-SolarShare}
    APP_ENV: ${APP_ENV:-local}
    APP_DEBUG: ${APP_DEBUG:-true}
    APP_URL: ${APP_URL:-http://127.0.0.1:8000}
    APP_KEY: ${APP_KEY:-}
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_DATABASE: ${DB_DATABASE:-solarshare}
    DB_USERNAME: root
    DB_PASSWORD: ""
    CACHE_STORE: database
    SESSION_DRIVER: database
    QUEUE_CONNECTION: database
    BROADCAST_CONNECTION: reverb
    BROADCAST_DRIVER: reverb
    FILESYSTEM_DISK: local
    LOG_CHANNEL: stderr
    OLLAMA_ENABLED: "true"
    OLLAMA_BASE_URL: http://ollama:11434
    OLLAMA_URL: http://ollama:11434
    OLLAMA_MODEL: mistral:latest
    OLLAMA_TIMEOUT: "180"
    OLLAMA_KEEP_ALIVE: "-1"
    OLLAMA_NUM_CTX: "1024"
    OLLAMA_NUM_PREDICT: "220"
    REVERB_APP_ID: ${REVERB_APP_ID:-}
    REVERB_APP_KEY: ${REVERB_APP_KEY:-}
    REVERB_APP_SECRET: ${REVERB_APP_SECRET:-}
    REVERB_HOST: reverb
    REVERB_PORT: "8081"
    REVERB_SCHEME: http
    REVERB_SERVER_HOST: 0.0.0.0
    REVERB_SERVER_PORT: "8081"
    CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
    CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
    CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    RUN_MIGRATIONS: "false"
  depends_on:
    mysql:
      condition: service_healthy
    ollama-pull:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  app:
    <<: *php
    build:
      context: .
      args:
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY:-}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-8081}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      <<: *php-env
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-false}
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-solarshare}
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  queue:
    <<: *php
    command: ["php", "artisan", "queue:work", "--sleep=1", "--tries=3", "--timeout=90"]

  reverb:
    <<: *php
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8081"]
    ports:
      - "${REVERB_PORT:-8081}:8081"

  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]

  # Official image. Port 11434 stays on the Docker network only.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: "-1"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: mistral:latest
    volumes:
      - ./docker/ollama-pull.sh:/ollama-pull.sh:ro
    entrypoint: ["/bin/sh", "/ollama-pull.sh"]
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

volumes:
  mysql_data:
  ollama_data:
