# Used when a SonarQube scanner is configured outside this Jenkinsfile.
# No scanner runs in the current pipeline: there is no SonarQube URL or token in the repository.
sonar.projectKey=solarshare
sonar.projectName=SolarShare
sonar.sources=app,routes,config,database
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.exclusions=vendor/**,node_modules/**,public/build/**,storage/**,bootstrap/cache/**,database/*.sqlite
sonar.test.inclusions=tests/**/*.php
sonar.php.coverage.reportPaths=build/coverage.xml
sonar.scanner.cache.enable=true
