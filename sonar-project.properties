# Project key must already exist on the SonarQube server used by Jenkins.
# The token is stored in the Jenkins credential sonarqube-solarshare-token.
sonar.projectKey=solarshare
sonar.projectName=SolarShare
sonar.sources=app,routes,config,database
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.exclusions=vendor/**,node_modules/**,public/build/**,storage/**,bootstrap/cache/**,database/*.sqlite
sonar.test.inclusions=tests/**/*.php
sonar.php.tests.reportPath=build/ci-reports/junit.xml
sonar.php.coverage.reportPaths=build/ci-reports/coverage.xml
sonar.scanner.cache.enable=true
