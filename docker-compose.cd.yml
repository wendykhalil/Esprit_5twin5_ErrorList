# Test delivery only. It never builds an image and never uses the local MySQL volume.
# SOLARSHARE_IMAGE must be the immutable GHCR tag of the commit being delivered.

name: solarshare-cd

services:
  app:
    image: ${SOLARSHARE_IMAGE}
    init: true
    ports:
      - "127.0.0.1:8010:8000"
    environment:
      APP_NAME: SolarShare
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://127.0.0.1:8010
      APP_KEY: base64:YWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWFhYWE=
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: solarshare
      DB_USERNAME: root
      DB_PASSWORD: ""
      CACHE_STORE: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync
      BROADCAST_CONNECTION: log
      FILESYSTEM_DISK: local
      LOG_CHANNEL: stderr
      OLLAMA_ENABLED: "false"
      RUN_MIGRATIONS: "false"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "$$c=@file_get_contents('http://127.0.0.1:8000/up'); $$s=$$http_response_header[0]??''; exit($$c!==false && preg_match('/\\s2\\d\\d\\s/',$$s)===1 ? 0 : 1);"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: "no"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: solarshare
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - solarshare_cd_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: "no"

volumes:
  solarshare_cd_mysql_data:
